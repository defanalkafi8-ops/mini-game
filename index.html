<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Mini</title>
    <style>
        :root {
            --primary: #4a90e2;
            --dark: #1a1a1a;
            --cell-empty: #555;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }
        .status {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        #game-container {
            background-color: #2b2b2b;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            grid-template-rows: repeat(5, 50px);
            gap: 6px;
            background: #333;
            padding: 10px;
            border-radius: 8px;
        }
        .cell {
            background: var(--cell-empty);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .cell:hover {
            transform: scale(1.05);
        }
        .btn-action {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 25px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-action:hover {
            background: #357abd;
        }
    </style>
</head>
<body>

    <h1>🧩 Block Blast Mini</h1>
    <div class="status" id="bb-status">Skor: 0 (Isi penuh 1 baris atau 1 kolom!)</div>

    <div id="game-container">
        <div class="grid" id="bb-grid"></div>
        <button class="btn-action" onclick="initBlockBlast()">Reset Game</button>
    </div>

    <script>
        let bbScore = 0;
        const bbSize = 5;
        let bbGrid = [];

        // Fungsi untuk memulai atau mereset game
        function initBlockBlast() {
            bbScore = 0;
            document.getElementById('bb-status').innerText = "Skor: 0 (Isi penuh 1 baris atau 1 kolom!)";
            const container = document.getElementById('bb-grid');
            container.innerHTML = "";
            
            // Buat array grid kosong (0 artinya kosong)
            bbGrid = Array(bbSize * bbSize).fill(0);
            
            // Generate elemen kotak di HTML
            for(let i = 0; i < bbSize * bbSize; i++) {
                let cell = document.createElement('div');
                cell.className = "cell";
                cell.onclick = () => fillBlock(i);
                container.appendChild(cell);
            }
        }

        // Fungsi saat kotak diklik
        function fillBlock(index) {
            // Jika kotak sudah terisi, tidak bisa diklik lagi
            if(bbGrid[index] === 1) return;
            
            bbGrid[index] = 1;
            checkBlockBlastLines();
        }

        // Fungsi untuk mengecek baris atau kolom yang penuh
        function checkBlockBlastLines() {
            const cells = document.querySelectorAll('#bb-grid .cell');
            let clearRows = [], clearCols = [];

            // Cek baris dan kolom secara bersamaan
            for(let i = 0; i < bbSize; i++) {
                let rowFull = true;
                let colFull = true;
                
                for(let j = 0; j < bbSize; j++) {
                    // Cek baris i
                    if(bbGrid[i * bbSize + j] === 0) rowFull = false;
                    // Cek kolom i
                    if(bbGrid[j * bbSize + i] === 0) colFull = false;
                }
                
                if(rowFull) clearRows.push(i);
                if(colFull) clearCols.push(i);
            }

            // Hapus baris yang penuh dan tambah skor
            clearRows.forEach(r => {
                for(let j = 0; j < bbSize; j++) bbGrid[r * bbSize + j] = 0;
                bbScore += 10;
            });

            // Hapus kolom yang penuh dan tambah skor
            clearCols.forEach(c => {
                for(let j = 0; j < bbSize; j++) bbGrid[j * bbSize + c] = 0;
                bbScore += 10;
            });

            // Update warna visual kotak berdasarkan data array terbaru
            bbGrid.forEach((val, idx) => {
                cells[idx].style.background = val === 1 ? "var(--primary)" : "var(--cell-empty)";
            });

            // Update teks skor
            if (clearRows.length > 0 || clearCols.length > 0) {
                document.getElementById('bb-status').innerText = `💥 BOOM! Skor: ${bbScore}`;
            } else {
                document.getElementById('bb-status').innerText = `Skor: ${bbScore}`;
            }
        }

        // Jalankan game pertama kali saat halaman dimuat
        initBlockBlast();
    </script>
</body>
</html>
